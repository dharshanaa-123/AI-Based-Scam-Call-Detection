{% extends 'base.html' %}{% block content %}<div class="top"><div><div class="muted">INSIGHTS</div><h2>Analytics</h2></div></div><div class="two"><div class="card"><h3>Risk Levels</h3><div class="bars">{% for k,v in counts.items() %}<div class="barcol"><i style="height:{{[v*35,180]|min}}px"></i><b>{{v}}</b><div>{{k}}</div></div>{% endfor %}</div></div><div class="card"><h3>Predictions</h3><p>Scam <b>{{pred.SCAM}}</b></p><div class="bar"><div class="fill" style="width:{{(pred.SCAM/(pred.SCAM+pred.GENUINE)*100) if pred.SCAM+pred.GENUINE else 0}}%"></div></div><p>Genuine <b>{{pred.GENUINE}}</b></p><div class="bar"><div class="fill" style="width:{{(pred.GENUINE/(pred.SCAM+pred.GENUINE)*100) if pred.SCAM+pred.GENUINE else 0}}%"></div></div></div></div>{% endblock %}
